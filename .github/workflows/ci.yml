name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,codex]'
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q
      - name: Parse evaluation PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('evaluacion/cleanup-evaluations.ps1', 'evaluacion/run-evaluation-batch.ps1', 'evaluacion/summarize-evaluations.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$parseErrors)
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) { throw "PowerShell syntax failed: $file" }
          }
      - name: Mock evaluation, aggregate and cleanup smoke (Windows Python 3.11)
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $interpreter = (Get-Command python).Source
          & .\evaluacion\run-evaluation-batch.ps1 -SetName piloto -CaseIds SL-0001 -MaxCases 1 -MaxCalls 1 -PythonExecutable $interpreter
          if ($LASTEXITCODE -ne 0) { throw 'Mock batch failed' }
          $reportPath = '.\evaluacion\salida\evaluation-summary.json'
          if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Missing consolidated report' }
          $report = Get-Content -LiteralPath $reportPath -Encoding UTF8 -Raw | ConvertFrom-Json
          if ($report.totals.runs -ne 1 -or $report.totals.completed_results -ne 1) { throw 'Incorrect report totals' }
          & .\evaluacion\cleanup-evaluations.ps1 -MinAgeMinutes 0
          if (@(Get-ChildItem -LiteralPath '.\evaluacion\salida' -Directory).Count -ne 1) { throw 'Unexpected run directory' }
          & .\evaluacion\cleanup-evaluations.ps1 -MinAgeMinutes 0 -Apply
          if (@(Get-ChildItem -LiteralPath '.\evaluacion\salida' -Directory).Count -ne 0) { throw 'Cleanup left a run directory' }
          if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Cleanup removed consolidated report' }
