[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p4-semantic-labeler"
version = "0.1.0"
description = "Domain-independent contextual semantic labels with strict character limits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "P4-Semantic-Labeler contributors" }]
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9",
    # Pin the validated standalone library until its first release is published.
    "portable-tempdirs @ git+https://github.com/SergioGilBorras/portable-tempdirs.git@ab9bb3c044ff41e6d8a170f1aaac0237e2eab434",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx2>=2.4,<3", "ruff>=0.8", "mcp>=1.0,<2", "PyYAML>=6,<7"]

[project.scripts]
p4-labeler = "p4_semantic_labeler.interfaces.cli:main"
p4-labeler-mcp = "p4_semantic_labeler.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluacion/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "error:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.setuptools.package-data]
p4_semantic_labeler = ["prompts/*.txt"]
