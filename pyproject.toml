[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p4-semantic-labeler"
version = "0.1.0"
description = "Domain-independent contextual semantic labels with strict character limits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "P4-Semantic-Labeler contributors" }]
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9",
    # Pin the validated standalone library from its reviewed 0.1.2 main commit until a PyPI release is adopted.
    "portable-tempdirs @ git+https://github.com/SergioGilBorras/portable-tempdirs.git@fd6dbd640630e6911a53b4d756089099ec870a8b",
]

[project.optional-dependencies]
# Opt-in Codex bridge is tied to a current 1.2.0 main commit. It depends on the
# same immutable portable-tempdirs 0.1.2 commit as the core application.
codex = ["p4-codex-bridge @ git+https://github.com/SergioGilBorras/P4-Codex-Bridge.git@082705a0fb797d80d1010c6ead9b5dd2b3e69da4"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx2>=2.4,<3", "ruff>=0.8", "mcp>=1.0,<2", "PyYAML>=6,<7"]

[project.scripts]
p4-labeler = "p4_semantic_labeler.interfaces.cli:main"
p4-labeler-mcp = "p4_semantic_labeler.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluacion/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# The pytest cache is unrelated to portable-tempdirs and can be denied on Windows.
addopts = "-p no:cacheprovider"
filterwarnings = [
    "error:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.setuptools.package-data]
p4_semantic_labeler = ["prompts/*.txt"]
