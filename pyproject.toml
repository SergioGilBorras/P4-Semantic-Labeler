[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p4-semantic-labeler"
version = "0.1.1"
description = "AI-powered semantic labeling service that generates concise, context-aware titles and summaries from code, text, and documents. Supports configurable length, writing styles, multiple languages, and API, CLI, and MCP interfaces. Integrates with P4-Codex-Bridge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergio Gil-Borrás" }]

[project.urls]
Repository = "https://github.com/SergioGilBorras/P4-Semantic-Labeler"
Documentation = "https://github.com/SergioGilBorras/P4-Semantic-Labeler/blob/main/README.md"
Issues = "https://github.com/SergioGilBorras/P4-Semantic-Labeler/issues"

dependencies = [
    "fastapi>=0.143.2,<1",
    "pydantic>=2.14.1,<3",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
    # Immutable Git ref shared with the P4-Codex-Bridge dependency.
    "portable-tempdirs @ git+https://github.com/SergioGilBorras/portable-tempdirs.git@aad3878ccd8347a1a23faf609b2db21265d30a1d",
]

[project.optional-dependencies]
# Optional Codex integration pinned to its reviewed source commit (version 1.4.1).
# Bridge and core install the same portable-tempdirs commit.
codex = ["p4-codex-bridge @ git+https://github.com/SergioGilBorras/P4-Codex-Bridge.git@a7e21c83670df925c478696c078d1cdc46fa3a9b"]
mcp = ["mcp>=2.3.0,<3"]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2", "httpx2>=2.13.1,<3", "ruff>=0.17.1,<1", "mcp>=2.3.0,<3", "PyYAML>=6,<7"]

[project.scripts]
p4-labeler = "p4_semantic_labeler.interfaces.cli:main"
p4-labeler-mcp = "p4_semantic_labeler.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluacion/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# The pytest cache is unrelated to portable-tempdirs and can be denied on Windows.
addopts = "-p no:cacheprovider"
filterwarnings = [
    "error:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.setuptools.package-data]
p4_semantic_labeler = ["prompts/*.txt"]
